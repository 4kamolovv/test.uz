<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title langIn="TestPageTitle"></title>
  <script>
    (function () {
      const theme = localStorage.getItem("theme");
      if (theme) {
        document.documentElement.setAttribute("data-theme", theme);
      }
    })();
  </script>
  <link rel="site icon" type="png" href="../images/icons/logoiconsite.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/test.css" />
</head>
<body>
  <div id="progress-bg"></div>
  <div id="progress-bar"></div>
  
  <div class="container">
    <div class="backto-mainpage-wrapper">
      <div class="bck-pointer">
        <svg class="backto-mainpage-icon" width="800px" height="800px" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"><path d="M224 480h640a32 32 0 1 1 0 64H224a32 32 0 0 1 0-64z"/><path d="m237.248 512 265.408 265.344a32 32 0 0 1-45.312 45.312l-288-288a32 32 0 0 1 0-45.312l288-288a32 32 0 1 1 45.312 45.312L237.248 512z"/></svg>
        <h3 class="backto-mainpage-p" langIn="BackToMain"></h3>
      </div>
    </div>
    
    <div class="quiz-layout">
      <div>
        <div class="quiz-info-card">
          <div class="quiz-subject" langIn="TestSubject" data-lang-skip></div>
          <div class="quiz-info-title" langIn="TestTopic" data-lang-skip></div>
          <div class="quiz-info-footer">
            <div class="quiz-info-stat">
              <img
              class="quiz-info-icon"
              src="../images/icons/staricon.svg"
              alt=""
              langAlt="RatingAlt"
              />
              <p class="quiz-info-text test-reviews"></p>
            </div>
            <div class="quiz-info-stat">
              <img
              class="quiz-info-icon"
              src="../images/icons/quantityicon.svg"
              alt=""
              langAlt="TestCountAlt"
              />
              <p class="quiz-info-text test-amount"></p>
            </div>
            <div class="quiz-info-stat">
              <img
              class="quiz-info-icon"
              src="../images/icons/viewsicon.svg"
              alt=""
              langAlt="ViewsAlt"
              />
              <p class="quiz-info-text test-views"></p>
            </div>
          </div>
        </div>
        
        <div class="progress-card">
          <h3 class="progress-title" langIn="TestQuestionsTitle"></h3>
          <div class="progress-meta">
            <span class="progress-meta-label" langIn="TestProgressLabel"></span>
            <span class="progress-meta-value" id="progress-percent">%</span>
          </div>
          <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progress-fill"></div>
          </div>
          <div class="progress-bar-text" id="progress-text"></div>
        </div>
      </div>
      
      
      <div class="quiz-container">
        <div class="quiz-question-box">
          <div class="quiz-question-header">
            <span class="quiz-question-progress"></span>
            <div class="quiz-tmsb-wrap">
              <div class="quiz-time" id="quizTime"></div>
              <div class="quiz-subject" langIn="TestSubject" data-lang-skip></div>
            </div>
          </div>
          <p class="quiz-question-label" langIn="HeroQuestionLabel"></p>
          <div class="quiz-question-text" langIn="TestQuestionText"></div>
        </div>
        
        <div class="quiz-options-box">
          <div class="quiz-options-title" langIn="TestOptionsTitle"></div>
          <img class="quiz-options-pic" src="" alt="" />
          
          <button class="quiz-option">
            <span class="quiz-label">a)</span>
            <span class="quiz-variant" langIn="TestOptionA"></span>
          </button>
          <button class="quiz-option">
            <span class="quiz-label">b)</span>
            <span class="quiz-variant" langIn="TestOptionB"></span>
          </button>
          <button class="quiz-option">
            <span class="quiz-label">c)</span>
            <span class="quiz-variant" langIn="TestOptionC"></span>
          </button>
          <button class="quiz-option">
            <span class="quiz-label">d)</span>
            <span class="quiz-variant" langIn="TestOptionD"></span>
          </button>
          
          <div class="quiz-controls">
            <button class="btn-complete" langIn="TestFinishBtn"></button>
            <div class="answerstatus-check-wrapper">
              <div class="answer-status"></div>
              <button class="btn-check" langIn="TestCheckBtn"></button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  
  <div class="modal-overlay" id="endModal">
    <div class="modal-box">
      <img
      class="yakunlash-image"
      src="../images/icons/complateredicon.png"
      alt=""
      langAlt="TestWarnAlt"
      />
      <h4 class="modal-title" langIn="TestEndTitle"></h4>
      <p class="modal-desc" langIn="TestEndDesc">
      </p>
      <div class="modal-actions">
        <button id="cancelEnd" class="btn-cancel" langIn="TestCancelBtn"></button>
        <button id="confirmEnd" class="btn-ok" langIn="TestFinishBtn"></button>
      </div>
    </div>
  </div>
  
  <div class="modal-overlay" id="resultModal">
    <div class="modal-box result-modal-box">
      <h4 class="result-title-h" langIn="TestResultTitle"></h4>
      <img
      class="result-icon-main"
      src="../images/icons/happy-result.webp"
      alt=""
      langAlt="TestResultAlt"
      />
      <h2 class="result-user" id="username">O'quvchi_8848756415</h2>
      <div class="result-summary">
        <div class="result-stat">
          <div class="result-icon-text">
            <img
            src="../images/icons/alltests.png"
            alt=""
            class="result-icon-small"
            />
            <b id="totalCount">15</b>
          </div>
          <span langIn="TestTotalLabel"></span>
        </div>
        <div class="result-stat">
          <div class="result-icon-text">
            <img
            src="../images/icons/correct.webp"
            alt=""
            class="result-icon-small"
            />
            <b class="correct-text" id="correctCount">0</b>
          </div>
          <span langIn="TestCorrectLabel"></span>
        </div>
        <div class="result-stat">
          <div class="result-icon-text">
            <img
            src="../images/icons/incorrect.png"
            alt=""
            class="result-icon-small"
            />
            <b class="wrong-text" id="wrongCount">0</b>
          </div>
          <span langIn="TestWrongLabel"></span>
        </div>
      </div>
      <div class="result-topic" id="resultTopic" langIn="TestResultTopic" data-lang-skip></div>
      <div class="result-time">
        <span langIn="TestResultTime"></span>
        <span class="result-time-value" id="resultTime"></span>
      </div>
      <div class="result-actions">
        <button class="back-tomain-page" langIn="TestBackHome"></button>
        <button id="restartBtn" class="btn-confirm" langIn="TestRestartBtn"></button>
      </div>
    </div>
  </div> 
  <script type="module" src="../js/quiz.js"></script>
  <script src="../js/main.js" defer></script>
  <script type="module" src="../js/auth-modal.js"></script>
</body>
</html>
