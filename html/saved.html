<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title langIn="PageSavedTitle"></title>
    <script>
        (function () {
            const theme = localStorage.getItem("theme");
            if (theme) document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
    <link rel="site icon" type="png" href="../images/icons/logoiconsite.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/style.css"/>
    <link rel="stylesheet" href="../css/themetest.css" />
</head>
<body>
    <div id="progress-bg"></div>
    <div id="progress-bar"></div>
    <header class="main-header">
        <div class="header-container">
            <a href="../index.html" class="logo-wrapper">
                <img id="logo-img" src="../images/image/logo_dark.png" alt="Logo">
            </a>
            <button class="nav-toggle" id="navToggle" type="button" aria-label="Menu" aria-expanded="false"><svg class="nav-toggle-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="3" rx="1.5"></rect><rect x="3" y="10.5" width="18" height="3" rx="1.5"></rect><rect x="3" y="16" width="18" height="3" rx="1.5"></rect></svg></button>
            <nav class="nav">
                <ul class="nav-list">
                    <li class="nav-item">
                        <a href="../index.html" class="nav-link" langIn="NavHome"></a>
                    </li>
                    <li class="nav-item">
                        <a href="../html/themetest.html" class="nav-link" langIn="NavThemeTest"></a>
                    </li>
                    <li class="nav-item">
                        <a href="../html/blocktests.html" class="nav-link" langIn="NavBlockTests"></a>
                    </li>
                    <li class="nav-item">
                        <a href="../html/rating.html" class="nav-link" langIn="NavRating"></a>
                    </li>
                    <li class="nav-item">
                        <a href="../html/news.html" class="nav-link" langIn="NavNews"></a>
                    </li>
                </ul>
            </nav>
            <div class="header-actions">
                <button class="btn-settings-header" type="button" id="openSettingsGuest" data-open-settings langTitle="SettingsTitle" title="" aria-label="Settings">
                    <svg class="is-stroke" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="12" r="3.2"></circle>
                        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 0 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"></path>
                    </svg>
                </button>
                <button class="btn-login" type="button" id="openAuth"></button>
                
                <div class="user-menu" id="userMenu" style="display:none;">
                    <button class="user-pill" id="userMenuBtn" type="button" aria-haspopup="menu" aria-expanded="false">
                        <span class="user-name" id="userName">Mehmon (Guest)</span>
                        <span class="user-avatar" id="userAvatar">G</span>
                        <span class="user-caret" aria-hidden="true">
                            <svg viewBox="0 0 24 24">
                                <path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round"></path>
                            </svg>
                        </span>
                    </button>
                    
                    <div class="user-dropdown" id="userDropdown" role="menu" aria-label="User menu">
                        <a class="dd-item" href="../html/profile.html" role="menuitem">
                            <span class="dd-ico" aria-hidden="true">
                                <svg viewBox="0 0 24 24">
                                    <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"></circle>
                                    <path d="M4 21a8 8 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round"></path>
                                </svg>
                            </span>
                            <span langIn="MenuProfile"></span>
                        </a>
                        
                        <a class="dd-item" href="../html/myresults.html" role="menuitem">
                            <span class="dd-ico" aria-hidden="true">
                                <svg viewBox="0 0 24 24">
                                    <path d="M4 19V5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                                    <path d="M8 19V11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                                    <path d="M12 19V7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                                    <path d="M16 19V14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                                    <path d="M20 19V9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                                </svg>
                            </span>
                            <span langIn="MenuResults"></span>
                        </a>
                        
                        <a class="dd-item" href="../html/saved.html" role="menuitem">
                            <span class="dd-ico" aria-hidden="true">
                                <svg viewBox="0 0 24 24">
                                    <path d="M6 3h12a2 2 0 0 1 2 2v16l-8-4-8 4V5a2 2 0 0 1 2-2Z"
                                    fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linejoin="round"></path>
                                </svg>
                            </span>
                            <span langIn="MenuSaved"></span>
                        </a>
                        
                        <a class="dd-item" href="" data-open-settings role="menuitem">
                            <span class="dd-ico" aria-hidden="true">
                                <svg class="is-stroke" viewBox="0 0 24 24" aria-hidden="true">
                                    <circle cx="12" cy="12" r="3.2"></circle>
                                    <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 0 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"></path>
                                </svg>
                            </span>
                            <span langIn="MenuSettings"></span>
                        </a>
                        
                        <div class="dd-sep" role="separator"></div>
                        
                        <button class="dd-item danger" id="btnLogout" type="button" role="menuitem">
                            <span class="dd-ico" aria-hidden="true">
                                <svg viewBox="0 0 24 24">
                                    <path d="M10 17v-2h8v-6h-8V7" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round"></path>
                                    <path d="M14 12H3" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round"></path>
                                    <path d="M6 9l-3 3 3 3" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round"></path>
                                    <path d="M20 21H12a2 2 0 0 1-2-2v-3" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round"></path>
                                    <path d="M10 8V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-8a2 2 0 0 1-2-2"
                                    fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round"></path>
                                </svg>
                            </span>
                            <span langIn="MenuLogout"></span>
                        </button>
                    </div>
                </div>
            </div>
            
        </div>
    </header>
    
    <main class="container">
        <div class="content-header" style="margin-block:16px;">
            <h1 class="content-title" langIn="SavedTitle"></h1>
            <div class="content-tools">
                <div class="search-container">
                    <img
                        src="../images/icons/searchicon.svg"
                        alt=""
                        langAlt="SearchAlt"
                        class="search-icon"
                    />
                    <input
                        id="savedSearch"
                        class="search-input"
                        type="text"
                        placeholder=""
                        langPlaceholder="SearchPlaceholder"
                    />
                </div>
            </div>
        </div>
        <div id="savedEmpty" class="empty-state" langIn="SavedLoading"></div>
        <div class="test-card-wrapper" id="savedCards"></div>
    </main>

    <div class="settings-overlay" id="settingsOverlay">
        <div class="settings-modal">
            <div class="settings-main">
                <div class="settings-title">
                    <span langIn="SettingsTitle"></span>
                    <button class="settings-close" id="settingsClose" type="button">
                        <svg viewBox="0 0 24 24">
                            <path d="M6 6l12 12M18 6L6 18"></path>
                        </svg>
                    </button>
                </div>
                <div class="settings-right">
                    <div class="set-pane active" data-pane="general">
                        <h2 langIn="SettingsGeneral"></h2>
                        <div class="set-row">
                            <div class="meta">
                                <b langIn="SettingsBgLabel"></b>
                                <span langIn="SettingsBgHint"></span>
                            </div>
                            <select class="settings-select" id="setTheme">
                                <option value="light" langIn="SettingsBgLight"></option>
                                <option value="dark" langIn="SettingsBgDark"></option>
                            </select>
                        </div>
                        <div class="set-row">
                            <div class="meta">
                                <b langIn="SettingsLangLabel"></b>
                                <span langIn="SettingsLangHint"></span>
                            </div>
                            <select class="settings-select" id="setLang">
                                <option value="uz" langIn="SettingsLangUz"></option>
                                <option value="ru" langIn="SettingsLangRu"></option>
                            </select>
                        </div>
                    </div>
                    <div class="settings-footer">
                        <span langIn="SettingsVersion"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-modal" role="dialog" aria-modal="true" aria-labelledby="authTitle">
            <button class="auth-close" id="authClose" aria-label="Yopish">x</button>
            <div class="auth-tabs">
                <button class="auth-tab active" id="tabLogin" type="button" langIn="AuthTabLogin"></button>
                <button class="auth-tab" id="tabRegister" type="button" langIn="AuthTabRegister"></button>
            </div>
            <div class="auth-pane active" id="paneLogin">
                <h3 class="auth-title" id="authTitle" langIn="AuthTitleLogin"></h3>
                <p class="auth-sub" langIn="AuthSubLogin"></p>
                <form id="loginForm" class="auth-form">
                    <input id="loginEmail" class="auth-input" type="email" placeholder="" langPlaceholder="AuthPlaceholderEmail" required />
                    <input id="loginPassword" class="auth-input" type="password" placeholder="" langPlaceholder="AuthPlaceholderPassword" required />
                    <button class="auth-btn primary" type="submit" langIn="AuthBtnLogin"></button>
                </form>
                <div class="auth-msg" id="loginMsg"></div>
            </div>
            <div class="auth-pane" id="paneRegister">
                <h3 class="auth-title" langIn="AuthTitleRegister"></h3>
                <p class="auth-sub" langIn="AuthSubRegister"></p>
                <form id="registerForm" class="auth-form">
                    <input id="regNickname" class="auth-input" type="text" placeholder="" langPlaceholder="AuthPlaceholderNickname" required />
                    <input id="regEmail" class="auth-input" type="email" placeholder="" langPlaceholder="AuthPlaceholderEmail" required />
                    <input id="regPassword" class="auth-input" type="password" placeholder="" langPlaceholder="AuthPlaceholderPasswordMin" minlength="6" required />
                    <button class="auth-btn primary" type="submit" langIn="AuthBtnRegister"></button>
                </form>
                <div class="auth-msg" id="regMsg"></div>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="logoutOverlay" aria-hidden="true">
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="logoutTitle">
            <img
            class="yakunlash-image"
            src="../images/icons/complateredicon.png"
            alt=""
            langAlt="TestWarnAlt"
            />
            <h4 class="modal-title" id="logoutTitle" langIn="LogoutTitle"></h4>
            <p class="modal-desc" langIn="LogoutSub"></p>
            <div class="modal-actions">
                <button id="logoutCancel" type="button" langIn="LogoutCancel" class="btn-cancel"></button>
                <button id="logoutYes" type="button" langIn="LogoutYes" class="btn-ok"></button>
            </div>
        </div>
    </div>
    <script src="../js/main.js" defer></script>
    <script type="module" src="../js/auth-modal.js"></script>
    <script type="module" src="../js/saved.js"></script>
    <script src="../js/settings-modal.js" defer></script>
</body>
</html>
